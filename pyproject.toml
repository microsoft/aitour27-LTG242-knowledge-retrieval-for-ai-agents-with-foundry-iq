[project]
name = "ltg242-foundry-infrastructure"
version = "0.1.0"
description = "Provisioning helpers for the LTG242 Foundry hosted agent"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.3.0,<2.4.0",
    "azure-identity>=1.25.3",
    "azure-mgmt-authorization>=4.0.0",
    "azure-search-documents==12.1.0b1",
    "azure-storage-blob>=12.30.0,<13",
    "jinja2>=3.1,<4",
    "playwright>=1.54,<2",
    "python-dotenv>=1.2.2",
    "aiohttp==3.14.3"
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
