[project]
name = "ltg242-foundry-infrastructure"
version = "0.1.0"
description = "Provisioning helpers for the LTG242 Foundry hosted agent"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.3.0,<2.4.0",
    "azure-identity>=1.25.3",
    "azure-mgmt-authorization>=4.0.0",
    "azure-search-documents==12.1.0b1",
    "azure-storage-blob>=12.30.0,<13",
    "python-dotenv>=1.2.2",
    "aiohttp==3.14.3",
    "asyncpg>=0.30.0,<1",
    "greenlet>=3.2.4,<4",
    "sqlalchemy>=2.0.43,<3",
    "psycopg[binary]>=3.2.10,<4",
    "fastmcp==4.0.0b3"
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]

[tool.uv]
package = false
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
